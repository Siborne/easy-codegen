name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: easy-codegen-web/frontend/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build frontend
        working-directory: easy-codegen-web/frontend
        run: |
          npm ci
          npm run build

      - name: Build Java modules
        env:
          MAVEN_OPTS: -Dfile.encoding=UTF-8
        shell: pwsh
        run: |
          cd easy-codegen
          mvn install -DskipTests
          cd ..\easy-codegen-web
          mvn install -DskipTests
          cd ..\easy-codegen-desktop
          mvn clean package -DskipTests

      - name: Package portable app-image
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ($version -notmatch '^\d+(\.\d+)+$') { $version = '0.0.0' }
          jpackage --type app-image `
            --name easy-codegen `
            --app-version $version `
            --input easy-codegen-desktop/target `
            --main-jar easy-codegen-desktop-1.0-SNAPSHOT.jar `
            --main-class org.springframework.boot.loader.JarLauncher `
            --java-options "-Dspring.profiles.active=packaged" `
            --dest dist/app-image
          Compress-Archive -Path "dist/app-image/easy-codegen" -DestinationPath "dist/easy-codegen-portable-win64.zip"

      - name: Package installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ($version -notmatch '^\d+(\.\d+)+$') { $version = '0.0.0' }
          choco install wixtoolset -y --no-progress
          jpackage --type exe `
            --name easy-codegen `
            --app-version $version `
            --input easy-codegen-desktop/target `
            --main-jar easy-codegen-desktop-1.0-SNAPSHOT.jar `
            --main-class org.springframework.boot.loader.JarLauncher `
            --java-options "-Dspring.profiles.active=packaged" `
            --dest dist/installer

      - name: Collect web executable jar
        shell: pwsh
        run: |
          Copy-Item easy-codegen-web/target/easy-codegen-web-1.0-SNAPSHOT-exec.jar dist/easy-codegen-web-exec.jar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy-codegen-dist
          path: |
            dist/easy-codegen-portable-win64.zip
            dist/installer/*.exe
            dist/easy-codegen-web-exec.jar

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/easy-codegen-portable-win64.zip
            dist/installer/*.exe
            dist/easy-codegen-web-exec.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
