<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codegen-Java 可视化面板</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 22px; }
        .header .status { font-size: 13px; color: #888; }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .field label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .field input, .field select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
            font-family: Consolas, monospace;
        }
        .field input:focus { outline: none; border-color: #409eff; }
        .field.wide { grid-column: 1 / -1; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .actions .spacer { flex: 1; }
        button {
            padding: 8px 18px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: #409eff; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #66b1ff; }
        .btn-success { background: #67c23a; color: #fff; }
        .btn-success:hover:not(:disabled) { background: #85ce61; }
        .btn-plain { background: #ecf5ff; color: #409eff; border: 1px solid #b3d8ff; }
        .btn-danger { background: #f56c6c; color: #fff; }
        .conn-result { font-size: 13px; margin-top: 10px; }
        .conn-result.ok { color: #67c23a; }
        .conn-result.err { color: #f56c6c; }
        .table-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .table-bar .count { font-size: 13px; color: #888; }
        .table-list {
            border: 1px solid #ebeef5;
            border-radius: 4px;
            max-height: 300px;
            overflow: auto;
        }
        .table-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid #f0f2f5;
            font-size: 13px;
            cursor: pointer;
        }
        .table-item:last-child { border-bottom: none; }
        .table-item:hover { background: #f5f7fa; }
        .table-item .tname { font-family: Consolas, monospace; font-weight: 600; min-width: 160px; }
        .table-item .tbean { font-family: Consolas, monospace; color: #409eff; min-width: 140px; }
        .table-item .tcomment { color: #999; }
        .empty-tip { padding: 20px; text-align: center; color: #aaa; font-size: 13px; }
        .log-area {
            background: #282c34;
            color: #d7dae0;
            border-radius: 6px;
            padding: 12px;
            font-family: Consolas, monospace;
            font-size: 12px;
            max-height: 320px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 12px;
            display: none;
        }
        .log-area.show { display: block; }
        .log-area .ok { color: #98c379; }
        .log-area .err { color: #e06c75; }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 16px;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transition: opacity .3s;
            z-index: 999;
        }
        .toast.show { opacity: 1; }
        .toast.ok { background: #67c23a; }
        .toast.err { background: #f56c6c; }
        .meta { font-size: 12px; color: #999; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="header">
    <h1>🔧 Codegen-Java 可视化面板</h1>
    <div class="status" id="configFile"></div>
</div>

<!-- 数据库连接 -->
<div class="card">
    <h2>数据库连接</h2>
    <div class="grid">
        <div class="field wide"><label>驱动类 (db.driver.name)</label><input data-key="db.driver.name"></div>
        <div class="field wide"><label>连接 URL (db.url)</label><input data-key="db.url"></div>
        <div class="field"><label>用户名 (db.username)</label><input data-key="db.username"></div>
        <div class="field"><label>密码 (db.password)</label><input type="password" data-key="db.password"></div>
    </div>
    <div class="actions" style="margin-top: 14px;">
        <button class="btn-plain" onclick="testConnection()">🔌 测试连接</button>
        <button class="btn-primary" onclick="saveConfig()">💾 保存配置</button>
        <button class="btn-plain" onclick="loadConfig()">🔄 重新加载</button>
    </div>
    <div class="conn-result" id="connResult"></div>
</div>

<!-- 生成参数 -->
<div class="card">
    <h2>生成参数</h2>
    <div class="grid">
        <div class="field"><label>作者 (author.comment)</label><input data-key="author.comment"></div>
        <div class="field"><label>忽略表名前缀 (ignore.table.prefix)</label>
            <select data-key="ignore.table.prefix">
                <option value="false">false</option>
                <option value="true">true</option>
            </select>
        </div>
        <div class="field"><label>忽略 JSON 字段 (ignore.bean.tojson.field)</label><input data-key="ignore.bean.tojson.field"></div>
        <div class="field"><label>忽略注解 (ignore.bean.tojson.expression)</label><input data-key="ignore.bean.tojson.expression"></div>
        <div class="field wide"><label>忽略注解 import (ignore.bean.tojson.class)</label><input data-key="ignore.bean.tojson.class"></div>
        <div class="field wide"><label>日期序列化表达式 (bean.date.format.expression)</label><input data-key="bean.date.format.expression"></div>
        <div class="field wide"><label>日期序列化 import (bean.date.format.class)</label><input data-key="bean.date.format.class"></div>
        <div class="field wide"><label>日期反序列化表达式 (bean.date.unformat.expression)</label><input data-key="bean.date.unformat.expression"></div>
        <div class="field wide"><label>日期反序列化 import (bean.date.unformat.class)</label><input data-key="bean.date.unformat.class"></div>
        <div class="field"><label>查询 Bean 后缀 (suffix.bean.query)</label><input data-key="suffix.bean.query"></div>
        <div class="field"><label>模糊搜索后缀 (suffix.bean.query.fuzzy)</label><input data-key="suffix.bean.query.fuzzy"></div>
        <div class="field"><label>开始时间后缀 (suffix.bean.query.time.start)</label><input data-key="suffix.bean.query.time.start"></div>
        <div class="field"><label>结束时间后缀 (suffix.bean.query.time.end)</label><input data-key="suffix.bean.query.time.end"></div>
        <div class="field"><label>Mapper 后缀 (suffix.mappers)</label><input data-key="suffix.mappers"></div>
    </div>
</div>

<!-- 输出与包名 -->
<div class="card">
    <h2>输出与包名</h2>
    <div class="grid">
        <div class="field wide"><label>输出根路径 (path.base)</label><input data-key="path.base"></div>
        <div class="field wide"><label>根包名 (package.base)</label><input data-key="package.base"></div>
        <div class="field"><label>PO 包 (package.po)</label><input data-key="package.po"></div>
        <div class="field"><label>Query 包 (package.query)</label><input data-key="package.query"></div>
        <div class="field"><label>VO 包 (package.vo)</label><input data-key="package.vo"></div>
        <div class="field"><label>工具包 (package.utils)</label><input data-key="package.utils"></div>
        <div class="field"><label>枚举包 (package.enums)</label><input data-key="package.enums"></div>
        <div class="field"><label>异常包 (package.exception)</label><input data-key="package.exception"></div>
        <div class="field"><label>Mapper 包 (package.mappers)</label><input data-key="package.mappers"></div>
        <div class="field"><label>Service 包 (package.service)</label><input data-key="package.service"></div>
        <div class="field"><label>ServiceImpl 包 (package.service.impl)</label><input data-key="package.service.impl"></div>
        <div class="field"><label>Controller 包 (package.controller)</label><input data-key="package.controller"></div>
    </div>
</div>

<!-- 配置模板 -->
<div class="card">
    <h2>配置模板</h2>
    <div class="grid">
        <div class="field"><label>模板名称</label><input id="templateName" placeholder="如: 测试环境"></div>
    </div>
    <div class="actions" style="margin-top: 12px;">
        <button class="btn-plain" onclick="saveTemplate()">📌 保存当前配置为模板</button>
        <select id="templateSelect" style="padding: 7px 10px; border: 1px solid #dcdfe6; border-radius: 4px; min-width: 160px;"></select>
        <button class="btn-plain" onclick="loadTemplate()">📂 加载模板</button>
        <button class="btn-danger" onclick="deleteTemplate()">🗑 删除模板</button>
    </div>
</div>

<!-- 数据表 -->
<div class="card">
    <h2>数据表</h2>
    <div class="table-bar">
        <div class="count" id="tableCount">尚未加载表</div>
        <div class="actions">
            <button class="btn-plain" onclick="loadTables()">📋 加载表列表</button>
            <button class="btn-plain" onclick="selectAll(true)">全选</button>
            <button class="btn-plain" onclick="selectAll(false)">全不选</button>
        </div>
    </div>
    <div class="table-list" id="tableList">
        <div class="empty-tip">点击"加载表列表"获取当前数据库的表</div>
    </div>
</div>

<!-- 代码生成 -->
<div class="card">
    <h2>代码生成</h2>
    <div class="actions">
        <button class="btn-success" onclick="generate()">🚀 一键生成</button>
        <span style="font-size: 13px; color: #999; align-self: center;">未勾选任何表时，将生成全部表</span>
    </div>
    <div class="log-area" id="logArea"></div>
</div>

<div class="meta" id="configFileMeta"></div>

<script>
    // 后端 API 地址：同源部署留空；前后端分离部署时通过 URL 参数指定，如 index.html?api=http://localhost:9000
    var API_BASE = new URLSearchParams(location.search).get('api') || '';
    var toastTimer = null;
    var tableData = [];

    function toast(msg, ok) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show ' + (ok ? 'ok' : 'err');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.className = 'toast'; }, 3000);
    }

    function collectConfig() {
        var data = {};
        document.querySelectorAll('[data-key]').forEach(function (el) {
            data[el.getAttribute('data-key')] = el.value.trim();
        });
        return data;
    }

    function loadConfig() {
        fetch(API_BASE + '/api/config')
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res.success) { toast(res.message || '读取配置失败', false); return; }
                var data = res.data || {};
                document.querySelectorAll('[data-key]').forEach(function (el) {
                    var key = el.getAttribute('data-key');
                    if (data[key] !== undefined) el.value = data[key];
                });
                document.getElementById('configFile').textContent = '配置文件: ' + res.file;
                document.getElementById('configFileMeta').textContent = '配置文件: ' + res.file;
                toast('配置已加载', true);
            })
            .catch(function (e) { toast('加载失败: ' + e.message, false); });
    }

    function saveConfig() {
        fetch(API_BASE + '/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(collectConfig())
        })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (res.success) { toast('配置已保存并生效', true); }
                else { toast(res.message || '保存失败', false); }
            })
            .catch(function (e) { toast('保存失败: ' + e.message, false); });
    }

    function testConnection() {
        saveConfig(); // 先保存生效，再测试
        var el = document.getElementById('connResult');
        el.className = 'conn-result';
        el.textContent = '正在测试连接...';
        fetch(API_BASE + '/api/connection/test', { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                el.className = 'conn-result ' + (res.success ? 'ok' : 'err');
                el.textContent = res.message;
                toast(res.message, res.success);
            })
            .catch(function (e) {
                el.className = 'conn-result err';
                el.textContent = '测试失败: ' + e.message;
            });
    }

    function loadTables() {
        saveConfig();
        toast('正在加载表列表...', true);
        fetch(API_BASE + '/api/tables', { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res.success) { toast(res.message || '加载表失败', false); return; }
                tableData = res.tables || [];
                renderTables();
                toast('已加载 ' + tableData.length + ' 张表', true);
            })
            .catch(function (e) { toast('加载失败: ' + e.message, false); });
    }

    function renderTables() {
        var list = document.getElementById('tableList');
        var count = document.getElementById('tableCount');
        if (!tableData.length) {
            list.innerHTML = '<div class="empty-tip">未获取到表，请检查数据库连接</div>';
            count.textContent = '共 0 张表';
            return;
        }
        var html = '';
        tableData.forEach(function (t, i) {
            html += '<div class="table-item" onclick="toggleRow(' + i + ')">' +
                '<input type="checkbox" id="tcb' + i + '" onclick="event.stopPropagation();toggleRow(' + i + ')">' +
                '<span class="tname">' + t.tableName + '</span>' +
                '<span class="tbean">' + t.beanName + '</span>' +
                '<span class="tcomment">' + (t.comment || '') + '</span>' +
                '</div>';
        });
        list.innerHTML = html;
        count.textContent = '共 ' + tableData.length + ' 张表（已选 0）';
        updateCount();
    }

    function toggleRow(i) {
        var cb = document.getElementById('tcb' + i);
        cb.checked = !cb.checked;
        updateCount();
    }

    function selectAll(checked) {
        tableData.forEach(function (t, i) {
            var cb = document.getElementById('tcb' + i);
            if (cb) cb.checked = checked;
        });
        updateCount();
    }

    function updateCount() {
        var n = 0;
        tableData.forEach(function (t, i) {
            var cb = document.getElementById('tcb' + i);
            if (cb && cb.checked) n++;
        });
        document.getElementById('tableCount').textContent = '共 ' + tableData.length + ' 张表（已选 ' + n + '）';
    }

    function getSelectedTables() {
        var selected = [];
        tableData.forEach(function (t, i) {
            var cb = document.getElementById('tcb' + i);
            if (cb && cb.checked) selected.push(t.tableName);
        });
        return selected;
    }

    function generate() {
        var selected = getSelectedTables();
        var tip = selected.length ? ('将生成 ' + selected.length + ' 张表: ' + selected.join(', ')) : '未勾选表，将生成全部表';
        if (!confirm('确认生成？\n' + tip)) return;

        var btn = event.target;
        btn.disabled = true;
        var log = document.getElementById('logArea');
        log.className = 'log-area show';
        log.innerHTML = '<div>开始生成...</div>';

        fetch(API_BASE + '/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ config: collectConfig(), tables: selected })
        })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (res.success) {
                    var html = '<div class="ok">✔ ' + res.message + '</div>';
                    (res.files || []).forEach(function (f) {
                        html += '<div>  - ' + f + '</div>';
                    });
                    log.innerHTML = html;
                    toast(res.message, true);
                } else {
                    log.innerHTML = '<div class="err">✘ ' + (res.message || '生成失败') + '</div>';
                    toast(res.message || '生成失败', false);
                }
            })
            .catch(function (e) {
                log.innerHTML = '<div class="err">✘ ' + e.message + '</div>';
                toast('生成失败: ' + e.message, false);
            })
            .finally(function () { btn.disabled = false; });
    }

    function loadTemplateList() {
        fetch(API_BASE + '/api/templates')
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res.success) return;
                var sel = document.getElementById('templateSelect');
                sel.innerHTML = '';
                (res.templates || []).forEach(function (n) {
                    var opt = document.createElement('option');
                    opt.value = n;
                    opt.textContent = n;
                    sel.appendChild(opt);
                });
            })
            .catch(function () {});
    }

    function saveTemplate() {
        var name = document.getElementById('templateName').value.trim();
        if (!name) { toast('请输入模板名称', false); return; }
        fetch(API_BASE + '/api/templates/' + encodeURIComponent(name), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(collectConfig())
        })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                toast(res.message, res.success);
                if (res.success) { document.getElementById('templateName').value = ''; loadTemplateList(); }
            })
            .catch(function (e) { toast('保存模板失败: ' + e.message, false); });
    }

    function loadTemplate() {
        var name = document.getElementById('templateSelect').value;
        if (!name) { toast('请先选择模板', false); return; }
        fetch(API_BASE + '/api/templates/' + encodeURIComponent(name))
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res.success) { toast(res.message, false); return; }
                var data = res.data || {};
                document.querySelectorAll('[data-key]').forEach(function (el) {
                    var key = el.getAttribute('data-key');
                    if (data[key] !== undefined) el.value = data[key];
                });
                toast('模板已加载: ' + name, true);
            })
            .catch(function (e) { toast('加载模板失败: ' + e.message, false); });
    }

    function deleteTemplate() {
        var name = document.getElementById('templateSelect').value;
        if (!name) { toast('请先选择模板', false); return; }
        if (!confirm('确认删除模板: ' + name + ' ?')) return;
        fetch(API_BASE + '/api/templates/' + encodeURIComponent(name), { method: 'DELETE' })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                toast(res.message, res.success);
                if (res.success) loadTemplateList();
            })
            .catch(function (e) { toast('删除模板失败: ' + e.message, false); });
    }

    loadConfig();
    loadTemplateList();
</script>
</body>
</html>
