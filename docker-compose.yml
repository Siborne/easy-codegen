# easy-codegen 一键体验：Web 面板 + MySQL 演示库
#
# 用法：
#   docker compose up -d --build
#   打开 http://localhost:9000
#   数据库连接（面板中填写，JDBC 在 app 容器内执行）：主机 mysql / 端口 3306 / root / 123456 / 库名 linklite
#   初始数据：user_info 演示表（见 docker/mysql/init/01-schema.sql）
#   若需用本机工具（如 Navicat）连演示库：localhost:3307

services:
  app:
    build: .
    image: easy-codegen:latest
    container_name: easy-codegen
    ports:
      - "9000:9000"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: easy-codegen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: linklite
      TZ: Asia/Shanghai
    ports:
      # 3307 映射到宿主，避免与本机已有 MySQL(3306) 冲突；app 容器内经服务名 mysql:3306 访问
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mysql-data:
