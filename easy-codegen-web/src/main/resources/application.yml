server:
  # 仅绑定本机回环地址，不暴露到局域网（安全默认）
  address: 127.0.0.1
  port: 8090

codegen:
  # 代码生成配置文件路径（默认指向仓库内核心模块配置；部署时可覆盖 CODEGEN_CONFIG_FILE 环境变量）
  config-file: ${CODEGEN_CONFIG_FILE:../easy-codegen/src/main/resources/application.properties}
  # 配置模板存储目录（部署时可覆盖 CODEGEN_TEMPLATE_DIR 环境变量）
  template-dir: ${CODEGEN_TEMPLATE_DIR:./config-templates}

spring:
  jackson:
    default-property-inclusion: non_null
